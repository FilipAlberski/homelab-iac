---
- name: Create MinIO directories
  ansible.builtin.file:
    path: "{{ minio_dir }}/data"
    state: directory
    owner: homelab
    group: homelab
    mode: '0755'

- name: Deploy MinIO Docker Compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ minio_dir }}/docker-compose.yml"
    owner: homelab
    group: homelab
    mode: '0644'
  notify: Restart minio

- name: Ensure MinIO compose is running
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ minio_dir }}"
  changed_when: true

- name: Install MinIO client
  ansible.builtin.get_url:
    url: "https://dl.min.io/client/mc/release/linux-amd64/mc"
    dest: /usr/local/bin/mc
    mode: '0755'
    owner: root
    group: root

- name: Configure MinIO client alias
  ansible.builtin.command: >
    /usr/local/bin/mc alias set local http://localhost:{{ minio_api_port }} {{ minio_root_user }} {{ minio_root_password }}
  args:
    creates: /root/.mc/config.json
  register: mc_alias
  changed_when: mc_alias.rc == 0

- name: Create seafile bucket
  ansible.builtin.command: /usr/local/bin/mc mb local/seafile --ignore-existing
  changed_when: false
