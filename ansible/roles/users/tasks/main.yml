---
- name: Utwórz zarządzane konta
  ansible.builtin.user:
    name: "{{ item.name }}"
    comment: "{{ item.comment | default(omit) }}"
    shell: "{{ item.shell | default('/bin/bash') }}"
    create_home: true
    password_lock: true
    state: present
  loop: "{{ managed_users | default([]) }}"
  loop_control:
    label: "{{ item.name }}"

- name: Dodaj klucze SSH do zarządzanych kont
  ansible.posix.authorized_key:
    user: "{{ item.0.name }}"
    key: "{{ item.1 }}"
    state: present
    manage_dir: true
  loop: "{{ managed_users | default([]) | subelements('authorized_keys', skip_missing=True) }}"
  loop_control:
    label: "{{ item.0.name }}"

- name: Zainstaluj sudo dla kont administracyjnych
  ansible.builtin.package:
    name: sudo
    state: present
  when: managed_users | default([]) | selectattr('sudo', 'defined') | selectattr('sudo') | list | length > 0

- name: Usuń nieobsługiwane pliki sudoers z kropką w nazwie
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ item.name }}"
    state: absent
  loop: "{{ managed_users | default([]) }}"
  when:
    - item.sudo | default(false) | bool
    - item.name is search('\\.')
  loop_control:
    label: "{{ item.name }}"

- name: Nadaj bezhasłowy dostęp sudo kontom administracyjnym
  ansible.builtin.copy:
    content: "{{ item.name }} ALL=(ALL:ALL) NOPASSWD: ALL\n"
    # sudo ignoruje pliki z kropką w nazwie w katalogu includedir.
    dest: "/etc/sudoers.d/{{ item.name | regex_replace('[^A-Za-z0-9_-]', '_') }}"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  loop: "{{ managed_users | default([]) }}"
  when: item.sudo | default(false) | bool
  loop_control:
    label: "{{ item.name }}"
