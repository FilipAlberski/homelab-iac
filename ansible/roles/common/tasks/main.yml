---
- name: Wait for cloud-init to finish
  ansible.builtin.command: cloud-init status --wait
  changed_when: false
  failed_when: false

- name: Read current timezone
  ansible.builtin.command: timedatectl show --property=Timezone --value
  register: common_current_timezone
  changed_when: false

- name: Set host timezone
  ansible.builtin.command: timedatectl set-timezone "{{ common_timezone }}"
  when: common_current_timezone.stdout != common_timezone
  changed_when: true

- name: Install common packages
  ansible.builtin.dnf:
    name: "{{ common_packages }}"
    state: present
    lock_timeout: 300

- name: Ensure firewalld is enabled and running
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started

- name: Disable VirtIO network offload (mitigates TX stall bug)
  vars:
    common_offload_script: |
      [Unit]
      Description=Disable VirtIO network hardware offloading
      After=network.target
      [Service]
      Type=oneshot
      ExecStart=/usr/sbin/ethtool -K eth0 tso off gso off gro off sg off tx off rx off
      RemainAfterExit=no
      [Install]
      WantedBy=multi-user.target
  ansible.builtin.copy:
    content: "{{ common_offload_script }}"
    dest: /etc/systemd/system/disable-virtio-offload.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd and enable VirtIO offload fix
