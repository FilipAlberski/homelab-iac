---
- name: Require a Cloudflare Tunnel token
  ansible.builtin.assert:
    that:
      - public_edge_cloudflared_tunnel_token | length > 0
    fail_msg: >-
      Set vault_cloudflared_tunnel_token in the encrypted inventory vault before
      deploying the public edge.
  no_log: true

- name: Create public edge directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ public_edge_dir }}"
      owner: homelab
      group: homelab
      mode: '0755'
    - path: "{{ public_edge_dir }}/traefik"
      owner: homelab
      group: homelab
      mode: '0755'
    - path: "{{ public_edge_dir }}/traefik/dynamic"
      owner: homelab
      group: homelab
      mode: '0755'
    - path: "{{ public_edge_dir }}/secrets"
      owner: "{{ public_edge_cloudflared_uid }}"
      group: "{{ public_edge_cloudflared_uid }}"
      mode: '0700'

- name: Store Cloudflare Tunnel token
  ansible.builtin.copy:
    content: "{{ public_edge_cloudflared_tunnel_token }}"
    dest: "{{ public_edge_dir }}/secrets/cloudflared-tunnel-token"
    owner: "{{ public_edge_cloudflared_uid }}"
    group: "{{ public_edge_cloudflared_uid }}"
    mode: '0400'
  no_log: true
  notify: Restart public edge

- name: Deploy public Traefik static configuration
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ public_edge_dir }}/traefik/traefik.yml"
    owner: homelab
    group: homelab
    mode: '0644'
  notify: Restart public edge

- name: Deploy empty public Traefik routing configuration
  ansible.builtin.template:
    src: dynamic.yml.j2
    dest: "{{ public_edge_dir }}/traefik/dynamic/routes.yml"
    owner: homelab
    group: homelab
    mode: '0644'
  notify: Restart public edge

- name: Deploy public edge Docker Compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ public_edge_dir }}/docker-compose.yml"
    owner: homelab
    group: homelab
    mode: '0644'
  notify: Restart public edge

- name: Ensure public edge compose is running
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ public_edge_dir }}"
  changed_when: true
