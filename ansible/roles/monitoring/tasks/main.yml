---
- name: Create monitoring directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: homelab
    group: homelab
    mode: '0755'
  loop:
    - "{{ monitoring_dir }}"
    - "{{ monitoring_dir }}/prometheus"
    - "{{ monitoring_dir }}/prometheus/data"
    - "{{ monitoring_dir }}/prometheus/rules"
    - "{{ monitoring_dir }}/loki"
    - "{{ monitoring_dir }}/loki/data"
    - "{{ monitoring_dir }}/loki/rules"
    - "{{ monitoring_dir }}/loki/rules/fake"
    - "{{ monitoring_dir }}/alertmanager"
    - "{{ monitoring_dir }}/blackbox"
    - "{{ monitoring_dir }}/grafana"
    - "{{ monitoring_dir }}/grafana/data"
    - "{{ monitoring_dir }}/grafana/provisioning"
    - "{{ monitoring_dir }}/grafana/provisioning/dashboards"
    - "{{ monitoring_dir }}/grafana/provisioning/datasources"
    - "{{ monitoring_dir }}/grafana/dashboards"

- name: Open firewall ports for monitoring
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - 3000/tcp
    - 9090/tcp
    - 9093/tcp
    - 3100/tcp
    - 9115/tcp
  become: true

- name: Deploy monitoring configuration
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: homelab
    group: homelab
    mode: '0644'
  loop:
    - src: docker-compose.yml.j2
      dest: "{{ monitoring_dir }}/docker-compose.yml"
    - src: prometheus.yml.j2
      dest: "{{ monitoring_dir }}/prometheus/prometheus.yml"
    - src: alerts.yml.j2
      dest: "{{ monitoring_dir }}/prometheus/rules/alerts.yml"
    - src: loki-config.yml.j2
      dest: "{{ monitoring_dir }}/loki/loki-config.yml"
    - src: loki-rules.yml.j2
      dest: "{{ monitoring_dir }}/loki/rules/fake/loki-rules.yml"
    - src: alertmanager.yml.j2
      dest: "{{ monitoring_dir }}/alertmanager/alertmanager.yml"
    - src: blackbox.yml.j2
      dest: "{{ monitoring_dir }}/blackbox/blackbox.yml"
    - src: grafana-datasources.yml.j2
      dest: "{{ monitoring_dir }}/grafana/provisioning/datasources/datasources.yml"
    - src: grafana-dashboards.yml.j2
      dest: "{{ monitoring_dir }}/grafana/provisioning/dashboards/dashboards.yml"
    - src: homelab-overview.json.j2
      dest: "{{ monitoring_dir }}/grafana/dashboards/homelab-overview.json"
    - src: vm-fleet.json.j2
      dest: "{{ monitoring_dir }}/grafana/dashboards/vm-fleet.json"
  notify: Restart monitoring

- name: Ensure monitoring compose is running
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ monitoring_dir }}"
  changed_when: true
