---
- name: Sprawdź sekret Actual Budget
  ansible.builtin.assert:
    that:
      - vault_actual_password is defined
      - vault_actual_password | length >= 12
    fail_msg: "Brakuje vault_actual_password w zaszyfrowanym Vault."

- name: Utwórz katalogi Actual Budget
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: "0755"
  loop:
    - "{{ actual_root }}"
    - "{{ actual_root }}/data"

- name: Otwórz port Actual Budget
  ansible.posix.firewalld:
    port: "{{ actual_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled

- name: Zapisz Compose Actual Budget
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ actual_root }}/docker-compose.yml"
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: "0600"

- name: Uruchom Actual Budget
  community.docker.docker_compose_v2:
    project_src: "{{ actual_root }}"
    files:
      - docker-compose.yml
    pull: missing
    state: present
