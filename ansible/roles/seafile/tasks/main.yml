---
- name: Create Seafile data directory
  ansible.builtin.file:
    path: "{{ seafile_dir }}"
    state: directory
    owner: homelab
    group: homelab
    mode: '0755'

- name: Deploy Seafile Docker Compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ seafile_dir }}/docker-compose.yml"
    owner: homelab
    group: homelab
    mode: '0644'

- name: Ensure Seafile compose is running
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ seafile_dir }}"
  changed_when: true
