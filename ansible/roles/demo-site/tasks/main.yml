---
- name: Validate demo deployment parameters
  ansible.builtin.assert:
    that:
      - demo_slug is defined
      - demo_slug is match('^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$')
      - demo_source is defined
      - demo_site_ttl_days | int >= 1
      - demo_site_ttl_days | int <= 3650
    fail_msg: >-
      Pass demo_slug, an existing demo_source directory, and a TTL between 1 and 3650 days.

- name: Check local demo artifact directory
  ansible.builtin.stat:
    path: "{{ demo_source }}"
  register: demo_source_stat
  delegate_to: localhost
  become: false

- name: Require a local demo artifact directory
  ansible.builtin.assert:
    that:
      - demo_source_stat.stat.exists
      - demo_source_stat.stat.isdir
    fail_msg: "Demo source directory does not exist: {{ demo_source }}"

- name: Check static demo entrypoint
  ansible.builtin.stat:
    path: "{{ demo_source }}/index.html"
  register: demo_index_stat
  delegate_to: localhost
  become: false

- name: Require a static demo entrypoint
  ansible.builtin.assert:
    that:
      - demo_index_stat.stat.exists
      - demo_index_stat.stat.isreg
    fail_msg: "Static demo artifact must contain index.html: {{ demo_source }}"

- name: Calculate demo expiry timestamp
  ansible.builtin.command:
    argv:
      - date
      - --utc
      - "--date={{ demo_site_ttl_days | int }} days"
      - +%Y-%m-%dT%H:%M:%SZ
  register: demo_site_expiry
  changed_when: false

- name: Define immutable demo release
  ansible.builtin.set_fact:
    demo_site_release_id: "{{ ansible_date_time.epoch }}"
    demo_site_release_dir: >-
      {{ demo_platform_sites_dir }}/{{ demo_slug }}/releases/{{ ansible_date_time.epoch }}

- name: Create demo release directory
  ansible.builtin.file:
    path: "{{ demo_site_release_dir }}"
    state: directory
    owner: homelab
    group: homelab
    mode: '0755'

- name: Upload static demo artifact
  ansible.posix.synchronize:
    src: "{{ demo_source }}/"
    dest: "{{ demo_site_release_dir }}/"
    archive: true
    delete: true
    rsync_opts:
      - --copy-links
      - --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r

- name: Activate demo release and write lifecycle metadata
  ansible.builtin.command:
    argv:
      - /usr/local/bin/democtl
      - deploy
      - "{{ demo_slug }}"
      - "{{ demo_site_release_id }}"
      - "{{ demo_site_expiry.stdout }}"
      - "{{ demo_site_source_repo }}"
  register: demo_site_deploy
  changed_when: true

- name: Show published demo URL
  ansible.builtin.debug:
    msg: >-
      Published {{ demo_site_deploy.stdout }} (expires {{ demo_site_expiry.stdout }}).
