---
- name: Ensure data disk is mounted
  ansible.builtin.include_tasks: disk.yml

- name: Create 7 Days to Die directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: homelab
    group: homelab
    mode: '0755'
  loop:
    - "{{ seven_days_to_die_dir }}"
    - "{{ seven_days_to_die_dir }}/7DaysToDie"
    - "{{ seven_days_to_die_dir }}/LGSM-Config"
    - "{{ seven_days_to_die_dir }}/ServerFiles"
    - "{{ seven_days_to_die_dir }}/log"
    - "{{ seven_days_to_die_dir }}/backups"

- name: Deploy 7 Days to Die Docker Compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ seven_days_to_die_dir }}/docker-compose.yml"
    owner: homelab
    group: homelab
    mode: '0644'
  notify: Restart 7dtd server

- name: Open firewall ports for 7 Days to Die
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - "{{ seven_days_to_die_game_port }}/tcp"
    - "{{ seven_days_to_die_game_port }}/udp"
    - "{{ seven_days_to_die_query_port_1 }}/udp"
    - "{{ seven_days_to_die_query_port_2 }}/udp"

- name: Pull 7 Days to Die server image
  ansible.builtin.command: docker compose pull
  args:
    chdir: "{{ seven_days_to_die_dir }}"
  register: seven_days_to_die_pull
  changed_when: "'Downloaded newer image' in seven_days_to_die_pull.stdout or 'Pull complete' in seven_days_to_die_pull.stdout"

- name: Ensure 7 Days to Die compose is running
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ seven_days_to_die_dir }}"
  changed_when: true

- name: Wait for 7 Days to Die server config
  ansible.builtin.wait_for:
    path: "{{ seven_days_to_die_dir }}/ServerFiles/sdtdserver.xml"
    timeout: "{{ seven_days_to_die_bootstrap_timeout }}"

- name: Configure 7 Days to Die Steam branch
  ansible.builtin.replace:
    path: "{{ seven_days_to_die_dir }}/LGSM-Config/sdtdserver.cfg"
    regexp: '^branch=".*"$'
    replace: 'branch="{{ seven_days_to_die_version | lower }}"'
  notify: Restart 7dtd server

- name: Configure 7 Days to Die network protocols
  ansible.builtin.lineinfile:
    path: "{{ seven_days_to_die_dir }}/ServerFiles/sdtdserver.xml"
    regexp: '<property name="ServerDisabledNetworkProtocols"\s+value='
    line: '  <property name="ServerDisabledNetworkProtocols" value="{{ seven_days_to_die_disabled_network_protocols }}"/>'
    insertbefore: '</ServerSettings>'
  notify: Restart 7dtd server

- name: Reset 7 Days to Die game world
  when: seven_days_to_die_reset_game | bool
  block:
    - name: Stop 7 Days to Die container
      ansible.builtin.command: docker compose down
      args:
        chdir: "{{ seven_days_to_die_dir }}"
      changed_when: true

    - name: Delete 7 Days to Die world saves
      ansible.builtin.file:
        path: "{{ seven_days_to_die_dir }}/7DaysToDie/Saves"
        state: absent

    - name: Delete 7 Days to Die generated worlds
      ansible.builtin.file:
        path: "{{ seven_days_to_die_dir }}/7DaysToDie/GeneratedWorlds"
        state: absent

- name: Configure 7 Days to Die world transfer speed
  ansible.builtin.lineinfile:
    path: "{{ seven_days_to_die_dir }}/ServerFiles/sdtdserver.xml"
    regexp: '<property name="ServerMaxWorldTransferSpeedKiBs"\s+value='
    line: '  <property name="ServerMaxWorldTransferSpeedKiBs" value="{{ seven_days_to_die_max_world_transfer_speed_kibs }}"/>'
    insertbefore: '</ServerSettings>'
  notify: Restart 7dtd server

- name: Configure 7 Days to Die sandbox code
  ansible.builtin.lineinfile:
    path: "{{ seven_days_to_die_dir }}/ServerFiles/sdtdserver.xml"
    regexp: '<property name="SandboxCode"\s+value='
    line: '  <property name="SandboxCode" value="{{ seven_days_to_die_sandbox_code }}"/>'
    insertbefore: '</ServerSettings>'
  notify: Restart 7dtd server

- name: Configure 7 Days to Die non-sandbox game settings
  ansible.builtin.lineinfile:
    path: "{{ seven_days_to_die_dir }}/ServerFiles/sdtdserver.xml"
    regexp: '<property name="{{ item.name }}"\s+value='
    line: '  <property name="{{ item.name }}" value="{{ item.value }}"/>'
    insertbefore: '</ServerSettings>'
  loop:
    - { name: PartySharedKillRange, value: "{{ seven_days_to_die_party_shared_kill_range }}" }
    - { name: PlayerKillingMode, value: "{{ seven_days_to_die_player_killing_mode }}" }
  notify: Restart 7dtd server

- name: Configure 7 Days to Die admin users
  ansible.builtin.lineinfile:
    path: "{{ seven_days_to_die_dir }}/7DaysToDie/Saves/serveradmin.xml"
    line: '    <user platform="{{ item.platform }}" userid="{{ item.userid }}" name="{{ item.name }}" permission_level="{{ item.permission_level }}" />'
    insertafter: '<users>'
    regexp: '<user platform="{{ item.platform }}" userid="{{ item.userid }}"'
  loop: "{{ seven_days_to_die_admins }}"
  notify: Restart 7dtd server
