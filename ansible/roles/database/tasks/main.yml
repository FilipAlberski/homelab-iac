---
- name: Create database directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: homelab
    group: homelab
    mode: '0755'
  loop:
    - "{{ database_dir }}"
    - "{{ database_dir }}/postgres-data"
    - "{{ database_dir }}/redis-data"

- name: Open firewall ports for database (restricted to back-01)
  ansible.posix.firewalld:
    rich_rule: 'rule family="ipv4" source address="{{ database_back_host }}" port protocol="tcp" port="{{ item }}" accept'
    permanent: true
    state: enabled
    immediate: true
  loop:
    - 5432
    - 6379
  become: true

- name: Deploy Database Docker Compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ database_dir }}/docker-compose.yml"
    owner: homelab
    group: homelab
    mode: '0644'
  notify: Restart database

- name: Ensure Database compose is running
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ database_dir }}"
  changed_when: true
