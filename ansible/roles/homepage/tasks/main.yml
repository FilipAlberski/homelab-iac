---
- name: Create Homepage directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: homelab
    group: homelab
    mode: '0755'
  loop:
    - "{{ homepage_dir }}"
    - "{{ homepage_config_dir }}"

- name: Deploy Homepage Docker Compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ homepage_dir }}/docker-compose.yml"
    owner: homelab
    group: homelab
    mode: '0644'
  notify: Restart homepage

- name: Deploy Homepage services config
  ansible.builtin.template:
    src: services.yaml.j2
    dest: "{{ homepage_config_dir }}/services.yaml"
    owner: homelab
    group: homelab
    mode: '0644'
  notify: Restart homepage

- name: Deploy Homepage settings config
  ansible.builtin.template:
    src: settings.yaml.j2
    dest: "{{ homepage_config_dir }}/settings.yaml"
    owner: homelab
    group: homelab
    mode: '0644'
  notify: Restart homepage

- name: Deploy Homepage bookmarks config
  ansible.builtin.template:
    src: bookmarks.yaml.j2
    dest: "{{ homepage_config_dir }}/bookmarks.yaml"
    owner: homelab
    group: homelab
    mode: '0644'
  notify: Restart homepage

- name: Deploy Homepage docker config
  ansible.builtin.template:
    src: docker.yaml.j2
    dest: "{{ homepage_config_dir }}/docker.yaml"
    owner: homelab
    group: homelab
    mode: '0644'
  notify: Restart homepage

- name: Ensure Homepage is running
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ homepage_dir }}"
  changed_when: true
