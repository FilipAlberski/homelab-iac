---
- name: Sprawdź klucz API Jellyfina dla Homepage
  ansible.builtin.assert:
    that:
      - vault_jellyfin_api_key is defined
      - vault_jellyfin_api_key | length >= 32
    fail_msg: "Brakuje vault_jellyfin_api_key dla widgetu Homepage."

- name: Utwórz katalogi Homepage
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: "0755"
  loop:
    - "{{ homepage_root }}"
    - "{{ homepage_root }}/config"

- name: Otwórz port Homepage
  ansible.posix.firewalld:
    port: "{{ homepage_port }}/tcp"
    permanent: true
    immediate: true
    state: enabled

- name: Zapisz bezsekretne pliki konfiguracji Homepage
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ homepage_root }}/config/{{ item }}"
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: "0644"
    backup: true
  loop:
    - settings.yaml
    - bookmarks.yaml
    - docker.yaml

- name: Zapisz konfigurację usług Homepage
  ansible.builtin.template:
    src: services.yaml.j2
    dest: "{{ homepage_root }}/config/services.yaml"
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: "0600"

- name: Zapisz Compose Homepage
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ homepage_root }}/docker-compose.yml"
    owner: "{{ homelab_user }}"
    group: "{{ homelab_user }}"
    mode: "0644"
    backup: true

- name: Uruchom Homepage
  community.docker.docker_compose_v2:
    project_src: "{{ homepage_root }}"
    files:
      - docker-compose.yml
    pull: missing
    state: present
