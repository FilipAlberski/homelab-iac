---
- name: Check media data disk
  ansible.builtin.stat:
    path: "{{ media_data_disk }}"
  register: media_data_disk_stat

- name: Require the dedicated media data disk
  ansible.builtin.assert:
    that:
      - media_data_disk_stat.stat.exists
      - media_data_disk_stat.stat.isblk
      - media_data_disk != '/dev/sda'
    fail_msg: >-
      {{ media_data_disk }} is missing or unsafe. jelly-01 expects its Terraform
      scsi1 disk at /dev/sdb; refusing to format another device.

- name: Read current media data disk mountpoint
  ansible.builtin.command: "lsblk -n -o MOUNTPOINT {{ media_data_disk }}"
  register: media_data_disk_mountpoint
  changed_when: false

- name: Refuse a data disk mounted somewhere else
  ansible.builtin.assert:
    that:
      - media_data_disk_mountpoint.stdout | trim in ['', media_data_mount]
    fail_msg: >-
      {{ media_data_disk }} is already mounted at
      {{ media_data_disk_mountpoint.stdout | trim }}; refusing to reuse it.

- name: Detect filesystem on media data disk
  ansible.builtin.command: "blkid -s TYPE -o value {{ media_data_disk }}"
  register: media_data_disk_filesystem
  changed_when: false
  failed_when: false

- name: Format blank media data disk with ext4
  ansible.builtin.command: "mkfs.ext4 -F -L media-data {{ media_data_disk }}"
  when: media_data_disk_filesystem.rc != 0
  changed_when: true

- name: Create media data mountpoint
  ansible.builtin.file:
    path: "{{ media_data_mount }}"
    state: directory
    owner: "{{ media_puid }}"
    group: "{{ media_pgid }}"
    mode: '2775'

- name: Mount media data filesystem
  ansible.posix.mount:
    path: "{{ media_data_mount }}"
    src: "{{ media_data_disk }}"
    fstype: ext4
    opts: defaults,noatime
    state: mounted

- name: Create shared media directory tree
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ media_puid }}"
    group: "{{ media_pgid }}"
    mode: '2775'
  loop:
    - "{{ media_data_mount }}"
    - "{{ media_data_mount }}/torrents"
    - "{{ media_data_mount }}/torrents/movies"
    - "{{ media_data_mount }}/torrents/tv"
    - "{{ media_data_mount }}/media"
    - "{{ media_data_mount }}/media/movies"
    - "{{ media_data_mount }}/media/tv"
