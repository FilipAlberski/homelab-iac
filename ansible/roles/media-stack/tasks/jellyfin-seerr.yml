---
- name: Read Jellyfin public system information
  ansible.builtin.uri:
    url: "http://{{ media_host_ip }}:{{ media_ports.jellyfin }}/System/Info/Public"
    return_content: true
  register: media_jellyfin_public_info

- name: Initialize Jellyfin
  when: not (media_jellyfin_public_info.json.StartupWizardCompleted | default(false) | bool)
  block:
    - name: Configure Jellyfin locale
      ansible.builtin.uri:
        url: "http://{{ media_host_ip }}:{{ media_ports.jellyfin }}/Startup/Configuration"
        method: POST
        body_format: json
        body:
          UICulture: pl-PL
          MetadataCountryCode: PL
          PreferredMetadataLanguage: pl
        status_code:
          - 200
          - 204

    - name: Initialize Jellyfin first user record
      ansible.builtin.uri:
        url: "http://{{ media_host_ip }}:{{ media_ports.jellyfin }}/Startup/User"
        return_content: true
        status_code: 200
      no_log: true

    - name: Create Jellyfin administrator
      ansible.builtin.uri:
        url: "http://{{ media_host_ip }}:{{ media_ports.jellyfin }}/Startup/User"
        method: POST
        body_format: json
        body:
          Name: "{{ media_jellyfin_admin_user }}"
          Password: "{{ media_jellyfin_admin_password }}"
        status_code:
          - 200
          - 204
      no_log: true

    - name: Configure Jellyfin remote access without automatic port mapping
      ansible.builtin.uri:
        url: "http://{{ media_host_ip }}:{{ media_ports.jellyfin }}/Startup/RemoteAccess"
        method: POST
        body_format: json
        body:
          EnableRemoteAccess: true
          EnableAutomaticPortMapping: false
        status_code:
          - 200
          - 204

    - name: Create Jellyfin media libraries
      ansible.builtin.uri:
        url: "http://{{ media_host_ip }}:{{ media_ports.jellyfin }}/Library/VirtualFolders?name={{ item.name }}&collectionType={{ item.type }}&paths={{ item.path }}"
        method: POST
        status_code:
          - 200
          - 204
      loop:
        - name: Movies
          type: movies
          path: "{{ media_data_mount }}/media/movies"
        - name: TV
          type: tvshows
          path: "{{ media_data_mount }}/media/tv"

    - name: Complete Jellyfin startup wizard
      ansible.builtin.uri:
        url: "http://{{ media_host_ip }}:{{ media_ports.jellyfin }}/Startup/Complete"
        method: POST
        status_code:
          - 200
          - 204

- name: Wait for Seerr API
  ansible.builtin.uri:
    url: "http://{{ media_host_ip }}:{{ media_ports.seerr }}/api/v1/settings/public"
    return_content: true
    status_code: 200
  register: media_seerr_public
  retries: 30
  delay: 5
  until: media_seerr_public.status == 200

- name: Enable Jellyfin real-time library monitoring
  ansible.builtin.replace:
    path: "{{ media_stack_config_dir }}/jellyfin/root/default/{{ item }}/options.xml"
    regexp: '<EnableRealtimeMonitor>false</EnableRealtimeMonitor>'
    replace: '<EnableRealtimeMonitor>true</EnableRealtimeMonitor>'
  loop:
    - Movies
    - TV
  notify: Restart Jellyfin

- name: Enable Intel Quick Sync when a render device is available
  ansible.builtin.replace:
    path: "{{ media_stack_config_dir }}/jellyfin/config/encoding.xml"
    regexp: '<HardwareAccelerationType>[^<]+</HardwareAccelerationType>'
    replace: '<HardwareAccelerationType>qsv</HardwareAccelerationType>'
  when: media_jellyfin_qsv_available | bool
  notify: Restart Jellyfin

- name: Enable HEVC hardware decoding for Intel Quick Sync
  ansible.builtin.lineinfile:
    path: "{{ media_stack_config_dir }}/jellyfin/config/encoding.xml"
    regexp: '^\s*<string>hevc</string>$'
    line: '    <string>hevc</string>'
    insertafter: '^\s*<HardwareDecodingCodecs>$'
  when: media_jellyfin_qsv_available | bool
  notify: Restart Jellyfin

- name: Authenticate Seerr with Jellyfin administrator
  ansible.builtin.uri:
    url: "http://{{ media_host_ip }}:{{ media_ports.seerr }}/api/v1/auth/jellyfin"
    method: POST
    body_format: json
    body: >-
      {{ {
        'username': media_jellyfin_admin_user,
        'password': media_jellyfin_admin_password,
        'email': media_seerr_admin_email,
        'serverType': 2
      } | combine(
        (media_seerr_public.json.initialized | default(false) | bool)
        | ternary({}, {
          'hostname': 'jellyfin',
          'port': media_ports.jellyfin,
          'useSsl': false,
          'urlBase': ''
        })
      ) }}
    return_content: true
    status_code: 200
  register: media_seerr_login
  no_log: true

- name: Synchronize Jellyfin libraries into Seerr
  ansible.builtin.uri:
    url: "http://{{ media_host_ip }}:{{ media_ports.seerr }}/api/v1/settings/jellyfin/library?sync=true"
    headers:
      Cookie: "{{ media_seerr_login.cookies_string }}"
    return_content: true
  register: media_seerr_jellyfin_libraries
  no_log: true

- name: Enable Jellyfin libraries in Seerr
  ansible.builtin.uri:
    url: "http://{{ media_host_ip }}:{{ media_ports.seerr }}/api/v1/settings/jellyfin/library?enable={{ media_seerr_jellyfin_libraries.json | map(attribute='id') | join(',') }}"
    headers:
      Cookie: "{{ media_seerr_login.cookies_string }}"
    status_code: 200
  when: media_seerr_jellyfin_libraries.json | length > 0
  no_log: true

- name: Test Sonarr from Seerr
  ansible.builtin.uri:
    url: "http://{{ media_host_ip }}:{{ media_ports.seerr }}/api/v1/settings/sonarr/test"
    method: POST
    headers:
      Cookie: "{{ media_seerr_login.cookies_string }}"
    body_format: json
    body:
      hostname: sonarr
      port: "{{ media_ports.sonarr }}"
      apiKey: "{{ media_sonarr_api_key }}"
      useSsl: false
      baseUrl: ""
    return_content: true
    status_code: 200
  register: media_seerr_sonarr_test
  no_log: true

- name: Test Radarr from Seerr
  ansible.builtin.uri:
    url: "http://{{ media_host_ip }}:{{ media_ports.seerr }}/api/v1/settings/radarr/test"
    method: POST
    headers:
      Cookie: "{{ media_seerr_login.cookies_string }}"
    body_format: json
    body:
      hostname: radarr
      port: "{{ media_ports.radarr }}"
      apiKey: "{{ media_radarr_api_key }}"
      useSsl: false
      baseUrl: ""
    return_content: true
    status_code: 200
  register: media_seerr_radarr_test
  no_log: true

- name: Read Seerr Sonarr instances
  ansible.builtin.uri:
    url: "http://{{ media_host_ip }}:{{ media_ports.seerr }}/api/v1/settings/sonarr"
    headers:
      Cookie: "{{ media_seerr_login.cookies_string }}"
    return_content: true
  register: media_seerr_sonarr_instances
  no_log: true

- name: Add Sonarr to Seerr
  ansible.builtin.uri:
    url: "http://{{ media_host_ip }}:{{ media_ports.seerr }}/api/v1/settings/sonarr"
    method: POST
    headers:
      Cookie: "{{ media_seerr_login.cookies_string }}"
    body_format: json
    body:
      name: Sonarr
      hostname: sonarr
      port: "{{ media_ports.sonarr }}"
      apiKey: "{{ media_sonarr_api_key }}"
      useSsl: false
      baseUrl: ""
      activeProfileId: "{{ media_seerr_sonarr_test.json.profiles[0].id }}"
      activeProfileName: "{{ media_seerr_sonarr_test.json.profiles[0].name }}"
      activeDirectory: "{{ media_data_mount }}/media/tv"
      is4k: false
      enableSeasonFolders: true
      isDefault: true
      externalUrl: "http://{{ media_host_ip }}:{{ media_ports.sonarr }}"
      syncEnabled: true
      preventSearch: false
    status_code: 201
  when: >-
    'Sonarr' not in (media_seerr_sonarr_instances.json | map(attribute='name') | list)
  no_log: true

- name: Read Seerr Radarr instances
  ansible.builtin.uri:
    url: "http://{{ media_host_ip }}:{{ media_ports.seerr }}/api/v1/settings/radarr"
    headers:
      Cookie: "{{ media_seerr_login.cookies_string }}"
    return_content: true
  register: media_seerr_radarr_instances
  no_log: true

- name: Add Radarr to Seerr
  ansible.builtin.uri:
    url: "http://{{ media_host_ip }}:{{ media_ports.seerr }}/api/v1/settings/radarr"
    method: POST
    headers:
      Cookie: "{{ media_seerr_login.cookies_string }}"
    body_format: json
    body:
      name: Radarr
      hostname: radarr
      port: "{{ media_ports.radarr }}"
      apiKey: "{{ media_radarr_api_key }}"
      useSsl: false
      baseUrl: ""
      activeProfileId: "{{ media_seerr_radarr_test.json.profiles[0].id }}"
      activeProfileName: "{{ media_seerr_radarr_test.json.profiles[0].name }}"
      activeDirectory: "{{ media_data_mount }}/media/movies"
      is4k: false
      minimumAvailability: released
      isDefault: true
      externalUrl: "http://{{ media_host_ip }}:{{ media_ports.radarr }}"
      syncEnabled: true
      preventSearch: false
    status_code: 201
  when: >-
    'Radarr' not in (media_seerr_radarr_instances.json | map(attribute='name') | list)
  no_log: true

- name: Mark Seerr setup complete
  ansible.builtin.uri:
    url: "http://{{ media_host_ip }}:{{ media_ports.seerr }}/api/v1/settings/initialize"
    method: POST
    headers:
      Cookie: "{{ media_seerr_login.cookies_string }}"
    status_code: 200
  when: not (media_seerr_public.json.initialized | default(false) | bool)
  no_log: true
