---
- name: Require media stack secrets
  ansible.builtin.assert:
    that:
      - media_mullvad_wireguard_private_key | length > 0
      - media_mullvad_wireguard_addresses | length > 0
      - media_qbittorrent_admin_password | length >= 12
      - media_jellyfin_admin_password | length >= 12
    fail_msg: >-
      Add vault_media_mullvad_wireguard_private_key,
      vault_media_mullvad_wireguard_addresses,
      vault_media_qbittorrent_admin_password and
      vault_media_jellyfin_admin_password to the encrypted inventory vault.
  no_log: true

- name: Prepare dedicated media storage
  ansible.builtin.include_tasks: storage.yml

- name: Create media stack configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ media_puid }}"
    group: "{{ media_pgid }}"
    mode: '0750'
  loop:
    - "{{ media_stack_dir }}"
    - "{{ media_stack_dir }}/cache"
    - "{{ media_stack_dir }}/cache/jellyfin"
    - "{{ media_stack_config_dir }}"
    - "{{ media_stack_config_dir }}/gluetun"
    - "{{ media_stack_config_dir }}/qbittorrent"
    - "{{ media_stack_config_dir }}/qbittorrent/qBittorrent"
    - "{{ media_stack_config_dir }}/sonarr"
    - "{{ media_stack_config_dir }}/radarr"
    - "{{ media_stack_config_dir }}/prowlarr"
    - "{{ media_stack_config_dir }}/bazarr"
    - "{{ media_stack_config_dir }}/jellyfin"
    - "{{ media_stack_config_dir }}/seerr"

- name: Check existing qBittorrent configuration
  ansible.builtin.stat:
    path: "{{ media_stack_config_dir }}/qbittorrent/qBittorrent/qBittorrent.conf"
  register: media_qbittorrent_config

- name: Generate qBittorrent password hash
  when: not media_qbittorrent_config.stat.exists
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import base64, hashlib, os;
        salt=os.urandom(16);
        digest=hashlib.pbkdf2_hmac('sha512', os.environ['QBIT_PASSWORD'].encode(), salt, 100000);
        print('@ByteArray('+base64.b64encode(salt).decode()+':'+base64.b64encode(digest).decode()+')')
  environment:
    QBIT_PASSWORD: "{{ media_qbittorrent_admin_password }}"
  register: media_qbittorrent_generated_hash
  changed_when: false
  no_log: true

- name: Set qBittorrent password hash
  when: not media_qbittorrent_config.stat.exists
  ansible.builtin.set_fact:
    media_qbittorrent_password_hash: "{{ media_qbittorrent_generated_hash.stdout }}"
  no_log: true

- name: Deploy initial qBittorrent configuration
  when: not media_qbittorrent_config.stat.exists
  ansible.builtin.template:
    src: qBittorrent.conf.j2
    dest: "{{ media_stack_config_dir }}/qbittorrent/qBittorrent/qBittorrent.conf"
    owner: "{{ media_puid }}"
    group: "{{ media_pgid }}"
    mode: '0600'
  no_log: true

- name: Check for Intel render device in the VM
  ansible.builtin.stat:
    path: /dev/dri/renderD128
  register: media_jellyfin_render_device

- name: Read GPU supplementary groups
  ansible.builtin.command: "getent group {{ item }}"
  loop:
    - render
    - video
  register: media_jellyfin_group_results
  changed_when: false
  failed_when: false

- name: Initialize Jellyfin GPU group list
  ansible.builtin.set_fact:
    media_jellyfin_gpu_gids: []

- name: Collect Jellyfin GPU group IDs
  ansible.builtin.set_fact:
    media_jellyfin_gpu_gids: "{{ media_jellyfin_gpu_gids + [item.stdout.split(':')[2]] }}"
  loop: "{{ media_jellyfin_group_results.results }}"
  when: item.rc == 0

- name: Decide whether to pass the render device to Jellyfin
  ansible.builtin.set_fact:
    media_jellyfin_qsv_available: >-
      {{ media_jellyfin_enable_qsv_when_available | bool
         and media_jellyfin_render_device.stat.exists
         and media_jellyfin_gpu_gids | length > 0 }}

- name: Deploy media stack secret environment
  ansible.builtin.template:
    src: media-stack.env.j2
    dest: "{{ media_stack_dir }}/.env"
    owner: root
    group: root
    mode: '0600'
  notify: Restart media stack
  no_log: true

- name: Deploy media verification credentials
  ansible.builtin.template:
    src: verify.env.j2
    dest: "{{ media_stack_dir }}/.verify.env"
    owner: root
    group: root
    mode: '0600'
  no_log: true

- name: Deploy media stack Docker Compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ media_stack_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: '0644'
  notify: Restart media stack

- name: Deploy media stack verification script
  ansible.builtin.template:
    src: verify-media-stack.sh.j2
    dest: "{{ media_stack_dir }}/verify-media-stack.sh"
    owner: root
    group: root
    mode: '0700'

- name: Allow media services only from the internal network
  ansible.posix.firewalld:
    rich_rule: >-
      rule family=ipv4 source address={{ media_lan_cidr }}
      port port={{ item }} protocol=tcp accept
    permanent: true
    state: enabled
    immediate: true
  loop: "{{ media_ports | dict2items | map(attribute='value') | list }}"

- name: Pull media stack images
  when: media_stack_pull_images | bool
  ansible.builtin.command: docker compose pull
  args:
    chdir: "{{ media_stack_dir }}"
  changed_when: true

- name: Ensure media stack is running
  ansible.builtin.command: docker compose up -d --remove-orphans
  args:
    chdir: "{{ media_stack_dir }}"
  changed_when: true

- name: Wait for media service ports
  ansible.builtin.wait_for:
    host: "{{ media_host_ip }}"
    port: "{{ item }}"
    timeout: 300
  loop:
    - "{{ media_ports.qbittorrent }}"
    - "{{ media_ports.sonarr }}"
    - "{{ media_ports.radarr }}"
    - "{{ media_ports.prowlarr }}"
    - "{{ media_ports.bazarr }}"
    - "{{ media_ports.jellyfin }}"
    - "{{ media_ports.seerr }}"

- name: Configure media application integrations
  when: media_configure_integrations | bool
  ansible.builtin.include_tasks: integrations.yml
