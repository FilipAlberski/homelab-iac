---
- name: Wait for Servarr configuration files
  ansible.builtin.wait_for:
    path: "{{ media_stack_config_dir }}/{{ item }}/config.xml"
    timeout: 300
  loop:
    - sonarr
    - radarr
    - prowlarr

- name: Read Servarr configuration files
  ansible.builtin.slurp:
    path: "{{ media_stack_config_dir }}/{{ item }}/config.xml"
  loop:
    - sonarr
    - radarr
    - prowlarr
  register: media_arr_config_files
  no_log: true

- name: Extract Servarr API keys
  ansible.builtin.set_fact:
    media_sonarr_api_key: >-
      {{ (media_arr_config_files.results[0].content | b64decode
          | regex_search('<ApiKey>([^<]+)</ApiKey>', '\1')) | first }}
    media_radarr_api_key: >-
      {{ (media_arr_config_files.results[1].content | b64decode
          | regex_search('<ApiKey>([^<]+)</ApiKey>', '\1')) | first }}
    media_prowlarr_api_key: >-
      {{ (media_arr_config_files.results[2].content | b64decode
          | regex_search('<ApiKey>([^<]+)</ApiKey>', '\1')) | first }}
  no_log: true

- name: Authenticate to qBittorrent
  ansible.builtin.uri:
    url: "http://{{ media_host_ip }}:{{ media_ports.qbittorrent }}/api/v2/auth/login"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ media_qbittorrent_admin_user }}"
      password: "{{ media_qbittorrent_admin_password }}"
    return_content: true
    status_code:
      - 200
      - 204
  register: media_qbittorrent_login
  failed_when: media_qbittorrent_login.content | trim not in ['', 'Ok.']
  no_log: true

- name: Configure qBittorrent paths and network safety
  ansible.builtin.uri:
    url: "http://{{ media_host_ip }}:{{ media_ports.qbittorrent }}/api/v2/app/setPreferences"
    method: POST
    headers:
      Cookie: "{{ media_qbittorrent_login.cookies_string }}"
    body_format: form-urlencoded
    body:
      json: >-
        {{ {
          'save_path': media_data_mount + '/torrents',
          'temp_path_enabled': false,
          'current_network_interface': 'tun0',
          'current_interface_address': '',
          'upnp': false,
          'web_ui_username': media_qbittorrent_admin_user,
          'web_ui_password': media_qbittorrent_admin_password
        } | to_json }}
    status_code: 200
  no_log: true

- name: Create qBittorrent media categories
  ansible.builtin.uri:
    url: "http://{{ media_host_ip }}:{{ media_ports.qbittorrent }}/api/v2/torrents/createCategory"
    method: POST
    headers:
      Cookie: "{{ media_qbittorrent_login.cookies_string }}"
    body_format: form-urlencoded
    body:
      category: "{{ item.name }}"
      savePath: "{{ item.path }}"
    status_code:
      - 200
      - 409
  loop:
    - name: tv
      path: "{{ media_data_mount }}/torrents/tv"
    - name: movies
      path: "{{ media_data_mount }}/torrents/movies"
  no_log: true

- name: Define Sonarr and Radarr integration settings
  ansible.builtin.set_fact:
    media_arr_services:
      - name: Sonarr
        api_base: "http://{{ media_host_ip }}:{{ media_ports.sonarr }}/api/v3"
        api_key: "{{ media_sonarr_api_key }}"
        root: "{{ media_data_mount }}/media/tv"
        category: tv
        category_field: tvCategory
      - name: Radarr
        api_base: "http://{{ media_host_ip }}:{{ media_ports.radarr }}/api/v3"
        api_key: "{{ media_radarr_api_key }}"
        root: "{{ media_data_mount }}/media/movies"
        category: movies
        category_field: movieCategory
  no_log: true

- name: Read Servarr root folders
  ansible.builtin.uri:
    url: "{{ item.api_base }}/rootfolder"
    headers:
      X-Api-Key: "{{ item.api_key }}"
    return_content: true
  loop: "{{ media_arr_services }}"
  register: media_arr_root_folders
  no_log: true

- name: Create Servarr media root folders
  ansible.builtin.uri:
    url: "{{ item.api_base }}/rootfolder"
    method: POST
    headers:
      X-Api-Key: "{{ item.api_key }}"
    body_format: json
    body:
      path: "{{ item.root }}"
    status_code: 201
  loop: "{{ media_arr_services }}"
  loop_control:
    index_var: media_arr_index
  when: >-
    item.root not in
    (media_arr_root_folders.results[media_arr_index].json | map(attribute='path') | list)
  no_log: true

- name: Read Servarr media management configuration
  ansible.builtin.uri:
    url: "{{ item.api_base }}/config/mediamanagement"
    headers:
      X-Api-Key: "{{ item.api_key }}"
    return_content: true
  loop: "{{ media_arr_services }}"
  register: media_arr_media_management
  no_log: true

- name: Enable Servarr hardlink imports
  ansible.builtin.uri:
    url: "{{ item.api_base }}/config/mediamanagement"
    method: PUT
    headers:
      X-Api-Key: "{{ item.api_key }}"
    body_format: json
    body: >-
      {{ media_arr_media_management.results[media_arr_index].json
         | combine({'copyUsingHardlinks': true}) }}
    status_code:
      - 200
      - 202
  loop: "{{ media_arr_services }}"
  loop_control:
    index_var: media_arr_index
  when: >-
    not (media_arr_media_management.results[media_arr_index].json.copyUsingHardlinks
         | default(false) | bool)
  no_log: true

- name: Read Servarr download clients
  ansible.builtin.uri:
    url: "{{ item.api_base }}/downloadclient"
    headers:
      X-Api-Key: "{{ item.api_key }}"
    return_content: true
  loop: "{{ media_arr_services }}"
  register: media_arr_download_clients
  no_log: true

- name: Add qBittorrent to Sonarr and Radarr
  ansible.builtin.uri:
    url: "{{ item.api_base }}/downloadclient"
    method: POST
    headers:
      X-Api-Key: "{{ item.api_key }}"
    body_format: json
    body:
      enable: true
      protocol: torrent
      priority: 1
      removeCompletedDownloads: true
      removeFailedDownloads: true
      name: qBittorrent
      fields:
        - name: host
          value: gluetun
        - name: port
          value: "{{ media_ports.qbittorrent }}"
        - name: useSsl
          value: false
        - name: urlBase
          value: ""
        - name: username
          value: "{{ media_qbittorrent_admin_user }}"
        - name: password
          value: "{{ media_qbittorrent_admin_password }}"
        - name: "{{ item.category_field }}"
          value: "{{ item.category }}"
        - name: initialState
          value: 0
        - name: sequentialOrder
          value: false
        - name: firstAndLast
          value: false
      implementationName: qBittorrent
      implementation: QBittorrent
      configContract: QBittorrentSettings
      tags: []
    status_code: 201
  loop: "{{ media_arr_services }}"
  loop_control:
    index_var: media_arr_index
  when: >-
    'qBittorrent' not in
    (media_arr_download_clients.results[media_arr_index].json | map(attribute='name') | list)
  no_log: true

- name: Configure FlareSolverr in Prowlarr
  ansible.builtin.include_tasks: flaresolverr.yml

- name: Configure Prowlarr applications
  ansible.builtin.include_tasks: prowlarr.yml

- name: Configure Bazarr connections
  ansible.builtin.include_tasks: bazarr.yml

- name: Configure Jellyfin and Seerr
  ansible.builtin.include_tasks: jellyfin-seerr.yml
