---
- name: Read Prowlarr applications
  ansible.builtin.uri:
    url: "http://{{ media_host_ip }}:{{ media_ports.prowlarr }}/api/v1/applications"
    headers:
      X-Api-Key: "{{ media_prowlarr_api_key }}"
    return_content: true
  register: media_prowlarr_applications
  no_log: true

- name: Define Prowlarr application integrations
  ansible.builtin.set_fact:
    media_prowlarr_targets:
      - name: Sonarr
        base_url: "http://sonarr:{{ media_ports.sonarr }}"
        api_key: "{{ media_sonarr_api_key }}"
        categories:
          - 5000
          - 5010
          - 5020
          - 5030
          - 5040
          - 5045
          - 5050
          - 5090
      - name: Radarr
        base_url: "http://radarr:{{ media_ports.radarr }}"
        api_key: "{{ media_radarr_api_key }}"
        categories:
          - 2000
          - 2010
          - 2020
          - 2030
          - 2040
          - 2045
          - 2050
          - 2060
          - 2070
          - 2080
          - 2090
  no_log: true

- name: Add Sonarr and Radarr to Prowlarr
  ansible.builtin.uri:
    url: "http://{{ media_host_ip }}:{{ media_ports.prowlarr }}/api/v1/applications"
    method: POST
    headers:
      X-Api-Key: "{{ media_prowlarr_api_key }}"
    body_format: json
    body:
      syncLevel: fullSync
      name: "{{ item.name }}"
      fields:
        - name: prowlarrUrl
          value: "http://prowlarr:{{ media_ports.prowlarr }}"
        - name: baseUrl
          value: "{{ item.base_url }}"
        - name: apiKey
          value: "{{ item.api_key }}"
        - name: syncCategories
          value: "{{ item.categories }}"
      implementationName: "{{ item.name }}"
      implementation: "{{ item.name }}"
      configContract: "{{ item.name }}Settings"
      tags: []
    status_code: 201
  loop: "{{ media_prowlarr_targets }}"
  when: >-
    item.name not in
    (media_prowlarr_applications.json | map(attribute='name') | list)
  no_log: true
