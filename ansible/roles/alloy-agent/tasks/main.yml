---
- name: Create Alloy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: homelab
    group: homelab
    mode: '0755'
  loop:
    - "{{ alloy_agent_dir }}"
    - "{{ alloy_agent_dir }}/data"

- name: Deploy Alloy configuration
  ansible.builtin.template:
    src: config.alloy.j2
    dest: "{{ alloy_agent_dir }}/config.alloy"
    owner: homelab
    group: homelab
    mode: '0644'
  notify: Restart alloy-agent

- name: Deploy Alloy Docker Compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ alloy_agent_dir }}/docker-compose.yml"
    owner: homelab
    group: homelab
    mode: '0644'
  notify: Restart alloy-agent

- name: Ensure Alloy compose is running
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ alloy_agent_dir }}"
  changed_when: true
