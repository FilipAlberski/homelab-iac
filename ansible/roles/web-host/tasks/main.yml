---
- name: Create web host directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: homelab
    group: homelab
    mode: '0755'
  loop:
    - "{{ web_host_dir }}"
    - "{{ web_host_dir }}/html"

- name: Deploy placeholder index.html
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ web_host_dir }}/html/index.html"
    owner: homelab
    group: homelab
    mode: '0644'

- name: Open firewall port for web host
  ansible.posix.firewalld:
    port: "{{ web_host_port }}/tcp"
    permanent: true
    state: enabled
    immediate: true
  become: true

- name: Deploy Web Host Docker Compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ web_host_dir }}/docker-compose.yml"
    owner: homelab
    group: homelab
    mode: '0644'
  notify: Restart web

- name: Ensure Web Host compose is running
  ansible.builtin.command: docker compose up -d
  args:
    chdir: "{{ web_host_dir }}"
  changed_when: true
