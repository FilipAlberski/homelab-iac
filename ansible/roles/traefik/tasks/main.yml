---
- name: Create Traefik directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: homelab
    group: homelab
    mode: '0755'
  loop:
    - /opt/traefik
    - /opt/traefik/config
    - /opt/traefik/certs

- name: Open firewall ports for Traefik
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - 80/tcp
    - 443/tcp
    - 8080/tcp
  become: true

- name: Check if Traefik wildcard certificate exists
  ansible.builtin.stat:
    path: /opt/traefik/certs/cert.pem
  register: traefik_cert

- name: Generate self-signed wildcard cert for *.lab
  when: not traefik_cert.stat.exists
  notify: Restart traefik
  block:
    - name: Create temporary OpenSSL config
      ansible.builtin.copy:
        content: |
          [req]
          distinguished_name = req_distinguished_name
          req_extensions = req_ext
          x509_extensions = v3_req
          prompt = no
          [req_distinguished_name]
          CN = *.lab
          [req_ext]
          subjectAltName = @alt_names
          [v3_req]
          subjectAltName = @alt_names
          [alt_names]
          DNS.1 = *.lab
          DNS.2 = lab
        dest: /opt/traefik/certs/openssl.cnf
        owner: homelab
        group: homelab
        mode: '0644'

    - name: Generate self-signed certificate and key
      ansible.builtin.command: |
        openssl req -x509 -nodes -days 3650 \
          -config /opt/traefik/certs/openssl.cnf \
          -newkey rsa:2048 \
          -keyout /opt/traefik/certs/key.pem \
          -out /opt/traefik/certs/cert.pem
      args:
        creates: /opt/traefik/certs/cert.pem
      changed_when: true

- name: Deploy Traefik static config
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: /opt/traefik/traefik.yml
    owner: homelab
    group: homelab
    mode: '0644'
  notify: Restart traefik

- name: Deploy Traefik dynamic config
  ansible.builtin.template:
    src: dynamic.yml.j2
    dest: /opt/traefik/config/dynamic.yml
    owner: homelab
    group: homelab
    mode: '0644'
  notify: Restart traefik

- name: Deploy Traefik Docker Compose
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/traefik/docker-compose.yml
    owner: homelab
    group: homelab
    mode: '0644'
  notify: Restart traefik

- name: Ensure Traefik compose is running
  ansible.builtin.command: docker compose up -d
  args:
    chdir: /opt/traefik
  changed_when: true
