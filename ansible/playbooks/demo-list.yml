---
- name: List demo websites
  hosts: demo
  become: true
  gather_facts: false

  tasks:
    - name: Read demo registry
      ansible.builtin.command: /usr/local/bin/democtl list
      register: demo_list_result
      changed_when: false

    - name: Show demo registry
      ansible.builtin.debug:
        var: demo_list_result.stdout_lines
