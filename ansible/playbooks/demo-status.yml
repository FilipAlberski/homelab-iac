---
- name: Change demo website lifecycle status
  hosts: demo
  become: true
  gather_facts: false

  tasks:
    - name: Validate lifecycle parameters
      ansible.builtin.assert:
        that:
          - demo_slug is defined
          - demo_slug is match('^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$')
          - demo_status is defined
          - demo_status in ['active', 'inactive', 'sold', 'lost', 'expired']
        fail_msg: >-
          Pass a DNS-safe demo_slug and demo_status=active|inactive|sold|lost|expired.

    - name: Set demo lifecycle status
      ansible.builtin.command:
        argv:
          - /usr/local/bin/democtl
          - status
          - "{{ demo_slug }}"
          - "{{ demo_status }}"
      register: demo_status_result
      changed_when: true

    - name: Show demo lifecycle result
      ansible.builtin.debug:
        var: demo_status_result.stdout_lines
