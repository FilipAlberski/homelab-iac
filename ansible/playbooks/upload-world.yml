---
- name: Upload PORTPOLSKA world files to games-01
  hosts: gaming
  become: true
  gather_facts: false

  vars:
    local_tarball: /tmp/PORTPOLSKA.tar.gz

  tasks:
    - name: Ensure worlds_local directory exists
      ansible.builtin.file:
        path: /opt/valheim/config/worlds_local
        state: directory
        owner: homelab
        group: homelab
        mode: '0755'

    - name: Remove old PORTPOLSKA world directory
      ansible.builtin.file:
        path: /opt/valheim/config/worlds_local/PORTPOLSKA
        state: absent

    - name: Upload PORTPOLSKA tarball
      ansible.builtin.copy:
        src: "{{ local_tarball }}"
        dest: /tmp/PORTPOLSKA.tar.gz
        owner: homelab
        group: homelab
        mode: '0644'

    - name: Extract tarball into worlds_local
      ansible.builtin.unarchive:
        src: /tmp/PORTPOLSKA.tar.gz
        dest: /opt/valheim/config/worlds_local/
        remote_src: true
        owner: homelab
        group: homelab

    - name: Ensure correct ownership on PORTPOLSKA directory
      ansible.builtin.file:
        path: /opt/valheim/config/worlds_local/PORTPOLSKA
        state: directory
        recurse: true
        owner: homelab
        group: homelab

    - name: Clean up tarball on remote
      ansible.builtin.file:
        path: /tmp/PORTPOLSKA.tar.gz
        state: absent
