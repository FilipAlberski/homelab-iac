---
- name: Pull latest images and recreate application containers
  hosts: apps
  become: true
  gather_facts: false

  tasks:
    - name: Pull application images
      ansible.builtin.command: docker compose pull
      args:
        chdir: "{{ item.path }}"
      loop:
        - name: Portainer
          path: /opt/portainer
        - name: Homepage
          path: /opt/homepage
        - name: Paperless-ngx
          path: /opt/paperless
        - name: Actual Budget
          path: /opt/actual
        - name: Seafile
          path: /srv/data/seafile
      loop_control:
        label: "{{ item.name }}"
      changed_when: true

    - name: Recreate application containers
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ item.path }}"
      loop:
        - name: Portainer
          path: /opt/portainer
        - name: Homepage
          path: /opt/homepage
        - name: Paperless-ngx
          path: /opt/paperless
        - name: Actual Budget
          path: /opt/actual
        - name: Seafile
          path: /srv/data/seafile
      loop_control:
        label: "{{ item.name }}"
      changed_when: true
