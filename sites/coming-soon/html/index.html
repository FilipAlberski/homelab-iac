<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>W trakcie budowy</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { align-items: center; background: #0b1020; color: #eef2ff; display: flex; margin: 0; min-height: 100vh; padding: 2rem; }
      main { margin: auto; max-width: 42rem; }
      p { color: #b8c1dc; font-size: 1.1rem; line-height: 1.65; }
      .eyebrow { color: #7dd3fc; font-size: .85rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { font-size: clamp(2.5rem, 9vw, 5.5rem); letter-spacing: -.06em; line-height: .95; margin: .5rem 0 1.5rem; }
      .mark { background: #38bdf8; border-radius: 50%; box-shadow: 0 0 3rem #38bdf880; display: inline-block; height: .8rem; margin-right: .4rem; width: .8rem; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow"><span class="mark"></span><span id="hostname">alberski.pl</span></p>
      <h1>W trakcie budowy.</h1>
      <p>Tu niedługo będzie coś dobrego. Wróć za chwilę.</p>
    </main>
    <script>document.getElementById('hostname').textContent = window.location.hostname;</script>
  </body>
</html>
